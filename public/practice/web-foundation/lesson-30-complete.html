<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스마트폰 사진 교실</title><style>body{margin:0;background:#f7f8fc;color:#172033;font-family:Arial,sans-serif}header,main{width:min(960px,calc(100% - 40px));margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.hero,.programs{margin:50px 0}.programs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.programs article,form{padding:24px;border-radius:16px;background:#fff}label,input,button{display:block;box-sizing:border-box;width:100%;margin-top:10px;padding:12px}button{background:#545bf4;color:#fff;border:0;border-radius:8px}@media(max-width:680px){header{align-items:flex-start;flex-direction:column}.programs{grid-template-columns:1fr}}</style></head><body><header><strong>사진 교실</strong><nav><a href="#programs">과정</a> · <a href="#apply">체험</a></nav></header><main><section class="hero"><h1>스마트폰 사진을 쉽게 정리하세요</h1><p>50대 초보자도 세 단계로 따라 하는 생활 사진 교육입니다.</p></section><section class="programs" id="programs"><article>사진 고르기</article><article>폴더 정리</article><article>가족 공유</article></section><form id="apply"><label for="name">연습용 이름</label><input id="name" maxlength="20"><button>체험 확인</button><p id="message" role="alert"></p></form></main><script>document.querySelector('#apply').addEventListener('submit',event=>{event.preventDefault();const name=document.querySelector('#name').value.trim();document.querySelector('#message').textContent=name?`${name}님의 체험 준비가 완료됐습니다.`:'이름을 입력해 주세요.'});</script></body></html>
