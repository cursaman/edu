<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>폼 검사</title></head><body><form id="apply-form" novalidate><label for="apply-name">연습용 이름</label><input id="apply-name" aria-describedby="error" maxlength="20"><button>신청 확인</button><p id="error" role="alert"></p></form><script>const form=document.querySelector('#apply-form');form.addEventListener('submit',event=>{event.preventDefault();const name=document.querySelector('#apply-name').value.trim();document.querySelector('#error').textContent=name?'체험 신청 내용을 확인했습니다.':'이름을 입력해 주세요.'});</script></body></html>
