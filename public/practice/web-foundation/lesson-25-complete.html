<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클릭 이벤트</title></head><body><button id="start-button" type="button">학습 시작</button><p id="message" aria-live="polite">버튼을 눌러 보세요.</p><script>const button=document.querySelector('#start-button');const message=document.querySelector('#message');button.addEventListener('click',()=>{message.textContent='1회차 학습을 시작합니다!';button.disabled=true});</script></body></html>
