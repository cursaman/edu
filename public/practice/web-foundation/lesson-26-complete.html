<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입력 이벤트</title></head><body><label for="name">연습용 이름</label><input id="name" maxlength="20"><p id="preview" aria-live="polite">입력한 이름이 여기에 보입니다.</p><script>const input=document.querySelector('#name');input.addEventListener('input',event=>{document.querySelector('#preview').textContent=event.target.value?`${event.target.value}님, 반갑습니다.`:'이름을 입력해 주세요.'});</script></body></html>
