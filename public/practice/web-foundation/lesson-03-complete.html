<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>우리 동네 사진 교실</title>
    <style>
      body { margin: 0; background: #f5f6ff; color: #172033; font-family: Arial, sans-serif; }
      main { width: min(680px, calc(100% - 40px)); margin: 80px auto; padding: 40px; box-sizing: border-box; border-radius: 24px; background: white; }
      h1 { margin-top: 0; font-size: clamp(32px, 7vw, 52px); }
      p { line-height: 1.8; }
      a { display: inline-block; margin-top: 16px; padding: 14px 20px; border-radius: 10px; background: #5b61f6; color: white; text-decoration: none; font-weight: 700; }
      @media (max-width: 600px) { main { margin: 24px auto; padding: 26px; } }
    </style>
  </head>
  <body>
    <main>
      <p>처음 시작해도 괜찮아요</p>
      <h1>우리 동네 사진 교실</h1>
      <p>휴대전화로 찍은 사진을 정리하고 가족과 공유하는 방법을 배웁니다.</p>
      <a href="mailto:practice@example.com">교육 문의하기</a>
    </main>
  </body>
</html>
